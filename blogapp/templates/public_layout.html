{{define "layout"}}<!doctype html>
<html lang="en" class="theme-{{.Blog.Theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <meta name="description" content="{{.Description}}">
  <meta name="robots" content="{{if .NoIndex}}noindex, follow{{else}}index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1{{end}}">
  <meta name="author" content="Arnav Sharma">
  <link rel="canonical" href="{{.Canonical}}">
  <meta name="theme-color" content="{{if eq .Blog.Theme "dark"}}#0f0f0e{{else}}#f3f3ef{{end}}">
  <meta property="og:site_name" content="ARNΛV">
  <meta property="og:locale" content="en_IN">
  <meta property="og:type" content="{{.OGType}}">
  <meta property="og:title" content="{{.Title}}">
  <meta property="og:description" content="{{.Description}}">
  <meta property="og:url" content="{{.Canonical}}">
  {{if .OGImage}}<meta property="og:image" content="{{.OGImage}}">{{end}}
  {{if .OGImage}}<meta property="og:image:alt" content="An illustrated dispatch from ARNΛV">{{end}}
  <meta name="twitter:card" content="{{if .OGImage}}summary_large_image{{else}}summary{{end}}">
  <meta name="twitter:title" content="{{.Title}}">
  <meta name="twitter:description" content="{{.Description}}">
  {{if .OGImage}}<meta name="twitter:image" content="{{.OGImage}}">{{end}}
  {{if .OGImage}}<meta name="twitter:image:alt" content="An illustrated dispatch from ARNΛV">{{end}}
  {{if .Post}}
  <meta property="article:published_time" content="{{dateISO .Post.PublishedAt}}">
  <meta property="article:modified_time" content="{{dateISO .Post.UpdatedAt}}">
  <meta property="article:section" content="{{.Blog.Name}}">
  {{range .Post.Tags}}<meta property="article:tag" content="{{.}}">{{end}}
  {{end}}
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">
  <link rel="alternate" type="application/rss+xml" title="ARNΛV — everything" href="/feed.xml">
  <link rel="alternate" type="application/rss+xml" title="ARNΛV — {{.Blog.Name}}" href="{{.Blog.Path}}/feed.xml">
  <link rel="stylesheet" href="/assets/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/assets/style.css">
  {{if .JSONLD}}<script type="application/ld+json">{{.JSONLD}}</script>{{end}}
</head>
<body class="theme-{{.Blog.Theme}}" data-blog="{{.Blog.Key}}" data-page="{{.Path}}"{{if .Post}} data-post-id="{{.Post.ID}}" data-post-slug="{{.Post.Slug}}"{{end}}{{if .PrintMode}} data-print="1"{{end}} data-views-url="/api/views">
  <script src="/assets/look-init.js"></script>
  <a class="skip-link" href="#main">Skip to the dispatch</a>
  <div class="paper-grain" aria-hidden="true"></div>
  {{template "masthead" .}}
  <main id="main">
    {{template "content" .}}
  </main>
  {{template "footer" .}}
  <script src="/assets/vendor/katex/katex.min.js" defer></script>
  <script src="/assets/app.js" defer></script>
</body>
</html>{{end}}
